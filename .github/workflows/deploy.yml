name: Deploy to Droplet

# Needs repository secrets DROPLET_HOST and DROPLET_SSH_KEY.
# Content (pages, posts, plugins) is edited in wp-admin, not deployed from
# here; this only ships changes to the server setup in this repo.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -e
            cd /opt/jackgannaway
            git pull --ff-only origin main
            docker compose pull
            docker compose up -d --remove-orphans
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile
            docker compose ps
